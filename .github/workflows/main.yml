name: WEB-GCP-VM-CICD

on:
  push: 
    branches: [deploy-kmj, deploy-kec, deploy-npr]
  pull_request: 
    branches: [deploy-kmj, deploy-kec, deploy-npr]

jobs:
  build-deploy:
    runs-on: ubuntu-22.04
    steps:  
      - name: "환경변수 세팅"
        run: |
            BRANCH_NAME="${{ github.ref_name }}"
            if [ "${{ github.event_name }}" == "pull_request" ]; then
              BRANCH_NAME="${{ github.base_ref }}"
            fi

            if [ "$BRANCH_NAME" = "deploy-kmj" ]; then
          
              echo "GCP_VM_HOST=${{ secrets.GCP_VM_HOST_KMJ }}" >> $GITHUB_ENV
              echo "GCP_VM_USERNAME=${{ secrets.GCP_VM_USERNAME_KMJ }}" >> $GITHUB_ENV
              echo "GCP_VM_SSHKEY<<EOF" >> $GITHUB_ENV
              echo "${{ secrets.GCP_VM_SSHKEY_KMJ }}" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
              echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME_KMJ }}" >> $GITHUB_ENV
              echo "DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD_KMJ }}" >> $GITHUB_ENV
              # APPLICATION_SECRET 은 웹 전용(.env with VITE_API_BASE_URL)이며,
              # 백엔드의 같은 이름 시크릿(application-secret.yaml)과 내용이 완전히 다르다.
              # ENV 시크릿은 백엔드 런타임 전용이라 웹에서 쓰지 않는다.
              echo "APPLICATION_SECRET=${{ secrets.APPLICATION_SECRET_KMJ }}" >> $GITHUB_ENV

            elif [ "$BRANCH_NAME" = "deploy-kec" ]; then
              # ... (나머지 브랜치 환경변수는 기존과 동일하게 유지)
              echo "GCP_VM_HOST=${{ secrets.GCP_VM_HOST_KEC }}" >> $GITHUB_ENV
              echo "GCP_VM_USERNAME=${{ secrets.GCP_VM_USERNAME_KEC }}" >> $GITHUB_ENV
              echo "GCP_VM_SSHKEY<<EOF" >> $GITHUB_ENV
              echo "${{ secrets.GCP_VM_SSHKEY_KEC }}" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
              echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME_KEC }}" >> $GITHUB_ENV
              echo "DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD_KEC }}" >> $GITHUB_ENV
              echo "APPLICATION_SECRET=${{ secrets.APPLICATION_SECRET_KEC }}" >> $GITHUB_ENV

            elif [ "$BRANCH_NAME" = "deploy-npr" ]; then
              # ... (나머지 브랜치 환경변수는 기존과 동일하게 유지)
              echo "GCP_VM_HOST=${{ secrets.GCP_VM_HOST_NPR }}" >> $GITHUB_ENV
              echo "GCP_VM_USERNAME=${{ secrets.GCP_VM_USERNAME_NPR }}" >> $GITHUB_ENV
              echo "GCP_VM_SSHKEY<<EOF" >> $GITHUB_ENV
              echo "${{ secrets.GCP_VM_SSHKEY_NPR }}" >> $GITHUB_ENV
              echo "EOF" >> $GITHUB_ENV
              echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME_NPR }}" >> $GITHUB_ENV
              echo "DOCKER_PASSWORD=${{ secrets.DOCKER_PASSWORD_NPR }}" >> $GITHUB_ENV
              echo "APPLICATION_SECRET=${{ secrets.APPLICATION_SECRET_NPR }}" >> $GITHUB_ENV
            fi
            
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.GCP_VM_SSHKEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -l -f ~/.ssh/id_rsa || echo "Invalid key format"
          
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          ref: ${{github.ref}}

      - name: React Web Build and Docker image build and push
        run: |
          # 1. 프론트엔드는 src/main/resources 가 아니라 최상단에 .env 로 생성합니다.
          echo "${{env.APPLICATION_SECRET}}" | base64 --decode > .env
          
          if [ -z "${{env.DOCKER_USERNAME}}" ]; then
            echo "Error: DOCKER_USERNAME is empty. Secrets might not be loaded properly."
            exit 1
          fi
          
          echo "${{env.DOCKER_PASSWORD}}" | docker login -u "${{env.DOCKER_USERNAME}}" --password-stdin
          
          # 2. 이미지 이름을 spring-app 에서 web-app 으로 변경합니다.
          docker build -t "${{env.DOCKER_USERNAME}}/web-app:latest" .
          docker push "${{env.DOCKER_USERNAME}}/web-app:latest"


      - name: GCP SSH REMOTE 원격접속
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{env.GCP_VM_HOST}}
          username: ${{env.GCP_VM_USERNAME}}
          key: ${{env.GCP_VM_SSHKEY}}
          script: |
            cd /home/${{env.GCP_VM_USERNAME}}

            # 여기서 .env 를 쓰지 않는다.
            # 웹 컨테이너는 nginx 정적 서빙이라 런타임 환경변수를 읽지 않는다.
            # VITE_API_BASE_URL 은 위 빌드 스텝에서 이미 번들에 박혔다.
            # 반면 /home/<user>/.env 는 백엔드(api) 워크플로가 쓰는 파일이라,
            # 여기서 덮어쓰면 같은 VM 의 백엔드 설정(DB·JWT·OAuth 시크릿)이 날아간다.

            # 3. 서버에서 실행할 파일 이름을 web-docker-compose.yaml로 맞춥니다.
            # (만약 지난번에 docker-compose.yml로 이름을 통일하셨다면 docker-compose.yml로 적어주세요!)
            sudo docker compose -f web-docker-compose.yaml pull
            sudo docker compose -f web-docker-compose.yaml down
            sudo docker compose -f web-docker-compose.yaml up -d
