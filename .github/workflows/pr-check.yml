name: PR-CHECK

# main 으로 들어오기 전에 거르는 관문. api 레포의 같은 이름 워크플로와 짝이다.
#
# web 에는 지금까지 검증이 배포 워크플로(main.yml)에만 있었는데, 그건 deploy-* 브랜치에서만
# 돌고 그나마도 lint·build 를 따로 보지 않는다(Dockerfile 안에서 npm run build 가 돌 뿐이라
# 빌드가 깨지면 이미지 빌드 단계에서 뭉뚱그려 실패한다). 그래서 깨진 코드가 main 에 머지된 뒤
# "배포하려는 순간"에야 드러난다.
#
# 2026-08-11: api 쪽에서 정확히 그 일이 났다. 시그니처를 바꾸고 테스트 호출부를 안 고친 PR 이
# 빨간 체크인 채로 머지돼 main 이 나흘간 배포 불가였고, 그 사이 배포가 없어 아무도 몰랐다.
# web 도 같은 구조라 같은 일이 날 수 있어 관문을 먼저 세운다.
#
# AGENTS.md 의 "작업을 끝내기 전 npm run lint 와 npm run build 가 통과해야 한다" 를
# 사람 손이 아니라 기계가 확인하게 만드는 것이 이 파일의 전부다.
on:
  pull_request:
    branches: [main]
  # deploy-* 에서 main 으로 되돌아오는 머지처럼 PR 을 거치지 않는 경로도 있어
  # main 푸시에서도 한 번 더 본다.
  push:
    branches: [main]

jobs:
  workflow-lint:
    name: 워크플로 문법 검사
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # 워크플로가 깨지면 워크플로는 스스로를 검사할 수 없다. GitHub 이 브랜치 필터조차
      # 읽지 못해 런이 0초 만에 죽고, 무엇이 잘못됐는지도 알려주지 않는다.
      # actionlint 는 파일만 읽으므로 그 상황에서도 원인을 짚어 준다.
      #
      # shellcheck·pyflakes 연동은 끈다. run: 블록의 셸 스타일까지 지적하기 시작하면
      # 기존 파일에서 잡음이 쏟아지고, 첫날부터 빨간 관문은 아무도 안 본다.
      - name: actionlint
        run: |
          bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -shellcheck= -pyflakes=

  lint-build:
    name: 린트·빌드
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # Dockerfile 이 node:20 으로 빌드한다. 관문과 실제 배포 빌드가 다른 노드에서 돌면
      # 여기서 통과한 것이 배포에서 깨질 수 있으므로 버전을 맞춘다.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 린트
        run: npm run lint

      # .env 없이 돌린다. src/api/client.js 가 VITE_API_BASE_URL 부재 시 localhost 로
      # 폴백하므로 빌드는 성립한다. 이 관문이 보는 것은 "코드가 빌드되는가" 하나이고,
      # 실제 주소가 맞는지는 배포 워크플로가 시크릿으로 .env 를 만들어 확인한다.
      - name: 빌드
        run: npm run build
